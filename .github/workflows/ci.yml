name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: vet
        run: go vet ./...
      - name: unit tests (race)
        run: go test -race -short ./...
      - name: end-to-end (real binaries, fake nft)
        run: go test -count=1 ./e2e
      - name: fuzz smoke (seed corpus + 10s per target)
        run: ./scripts/fuzz.sh 10s
