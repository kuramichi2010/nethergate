# /etc/systemd/system/nethergate-enforcer.service.d/cloudflare.conf
#
# The "cloudflare" enforcement backend calls the Cloudflare API, so the
# enforcer needs outbound HTTPS. Everything else stays as strict as before:
# it still listens on no network port.
[Service]
# CF_API_TOKEN=... : a token limited to "Zone > Firewall Services > Edit"
# on the one zone (chmod 600, root-owned). Only the enforcer reads it.
EnvironmentFile=/etc/nethergate/enforcer.env
# Reset the deny-all, then allow IP sockets for the API client.
IPAddressDeny=
RestrictAddressFamilies=AF_UNIX AF_NETLINK AF_INET AF_INET6
