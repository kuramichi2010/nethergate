# nginx behind a CDN (Cloudflare shown). Pick ONE of the two options.

# Option A (recommended): let nginx restore the client address, keep the
# default "combined" log, and use  {"format": "nginx"}  in nethergate.
#   set_real_ip_from 173.245.48.0/20;   # ...one line per Cloudflare range
#   set_real_ip_from 2400:cb00::/32;    # (`nethergate proxies cloudflare` checks the list)
#   real_ip_header   CF-Connecting-IP;  # or X-Forwarded-For with real_ip_recursive on;
#
# nethergate still refuses to score or block a request whose logged
# address is a CDN edge (trusted_proxies), so a missing real_ip line shows
# up as nethergate_proxy_unresolved_events_total > 0 instead of the CDN
# being blocked.

# Option B: log the TCP peer plus X-Forwarded-For and let nethergate pick
# the client:  {"format": "nginx_proxy"}  together with  "trusted_proxies".
log_format nethergate_proxy '$remote_addr - $remote_user [$time_local] "$request" '
                            '$status $body_bytes_sent "$http_referer" "$http_user_agent" '
                            '"$http_x_forwarded_for"';
access_log /var/log/nginx/access.log nethergate_proxy;

# Either way: only accept connections from the CDN on 80/443, so nobody can
# bypass it (and its blocks) by talking to the origin directly.
