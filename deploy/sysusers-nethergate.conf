# /etc/sysusers.d/nethergate.conf
#
# One user per role. The enforcer tells callers apart by UID, so the rule
# engine (watch), the AI gate (mcp) and the firewall owner (enforcer) must
# never share an account. Put the uids into config.json "enforcer_clients".
g nethergate -
u ng-enforcer - "nethergate enforcer (firewall only)" -
u ng-watch    - "nethergate watch (rules, playbook, triage launcher)" /home/ng-watch /usr/sbin/nologin
# ng-mcp needs a real shell: sshd runs the forced command from
# authorized_keys via the login shell, and the default nologin refuses it.
# The key itself is limited by "restrict,command=..." (create the home and
# a root-owned ~/.ssh/authorized_keys yourself; sysusers does not).
u ng-mcp      - "nethergate MCP gate for the AI (no privileges)" /home/ng-mcp /bin/sh
m ng-enforcer nethergate
m ng-watch    nethergate
m ng-mcp      nethergate
# Log read access (Debian/Ubuntu: adm). The enforcer reads the logs too: it
# re-derives every automated block from them instead of trusting callers.
m ng-enforcer adm
m ng-watch    adm
m ng-mcp      adm
